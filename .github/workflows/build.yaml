name: Verify and package CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    name: Lint, typecheck, build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build (Next.js)
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  build:
    runs-on: ubuntu-latest
    name: Build and push image
    needs: verify
    # Only publish images for release tags -- a plain push to main just runs
    # the verify job. Building/deploying on every merge was too eager: this
    # makes "merge the release-please PR" the one action that ships to prod.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/eigora-web
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Per-image cache scope so api and web don't clobber each other.
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Kubernetes
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout gitops repo
        uses: actions/checkout@v4
        with:
          repository: Tampipo/eigora-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Install kustomize
        run: |
          curl -sLo k.tgz https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz
          tar xzf k.tgz && sudo mv kustomize /usr/local/bin/

      - name: Bump image tags
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          TAG="${GITHUB_REF_NAME#v}"   # v1.2.3 -> 1.2.3 (matches type=semver docker tag)
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          cd "gitops/apps/eigora-web" \
            && kustomize edit set image "ghcr.io/$OWNER/eigora-web=ghcr.io/$OWNER/eigora-web:$TAG"

      - name: Commit and push changes
        run: |
          cd gitops 
          git diff --quiet && { echo "no image change"; exit 0; }
          git config user.name "github-actions[bot]" 
          git config user.email "github-actions[bot]@users.noreply.github.com" 
          git commit -am "deploy: ${{ github.event.repository.name }} images ${TAG}"
          git push
